services:
  - type: web
    name: dashboard-sesmt
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL      # string de conexão do Neon (preencher no painel do Render)
        sync: false
      - key: APP_PASSWORD      # senha de acesso ao dashboard (preencher no painel do Render)
        sync: false
      - key: SESSION_SECRET
        generateValue: true
